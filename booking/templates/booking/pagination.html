<div class="feature-actions">{% if page.has_previous %}<a href="?page={{ page.previous_page_number }}&amp;q={{ query|urlencode }}&amp;year={{ request.GET.year|urlencode }}&amp;stage={{ request.GET.stage|urlencode }}&amp;local_only={{ request.GET.local_only|urlencode }}">Previous</a>{% endif %}
<span>Page {{ page.number }} of {{ page.paginator.num_pages }}</span>{% if page.has_next %}<a href="?page={{ page.next_page_number }}&amp;q={{ query|urlencode }}&amp;year={{ request.GET.year|urlencode }}&amp;stage={{ request.GET.stage|urlencode }}&amp;local_only={{ request.GET.local_only|urlencode }}">Next</a>{% endif %}</div>
