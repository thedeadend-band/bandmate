{% load static %}
{% if instrument_categories %}
<div class="instrument-selector" aria-label="Playback instruments">
  {% for category in instrument_categories %}
  <button type="button" class="instrument-toggle{% if category in selected_instruments %} active{% endif %}"
          data-instrument="{{ category }}" aria-pressed="{% if category in selected_instruments %}true{% else %}false{% endif %}"
          title="Toggle {{ category }}">
    {% if category == 'master' %}
    <svg viewBox="0 0 24 24"><path d="M4 5h16v14H4z"/><path d="M8 9v6M12 7v10M16 10v4"/></svg>
    {% elif category == 'vocals' %}
    <svg viewBox="0 0 24 24"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10v1a7 7 0 0 0 14 0v-1M12 18v4M8 22h8"/></svg>
    {% elif category == 'guitars' %}
    <svg viewBox="0 0 24 24"><path d="M15 3l6-1-1 6-8 8"/><path d="M12 11c-2-1-5 0-7 2-3 3-2 7 1 8s6 0 8-3c2-2 3-5 2-7"/><circle cx="10" cy="16" r="2"/></svg>
    {% elif category == 'bass' %}
    <svg viewBox="0 0 24 24"><path d="M16 2l5 1-2 5-8 8"/><path d="M11 11c-2-1-5 0-7 2-2 3-1 6 1 8 3 1 6 0 8-3 2-2 2-5 1-7"/><path d="M17 4l3 3"/></svg>
    {% elif category == 'keys' %}
    <svg viewBox="0 0 24 24"><rect x="2" y="5" width="20" height="14" rx="1"/><path d="M6 5v9M10 5v9M14 5v9M18 5v9M2 14h20"/></svg>
    {% elif category == 'drums' %}
    <svg viewBox="0 0 24 24"><ellipse cx="12" cy="8" rx="8" ry="3"/><path d="M4 8v8c0 2 4 3 8 3s8-1 8-3V8M7 10v7M17 10v7M5 3l14 10M19 3L5 13"/></svg>
    {% elif category == 'click' %}
    <svg viewBox="0 0 24 24"><path d="M8 3h8l3 18H5z"/><path d="M12 6v9M9 18h6"/></svg>
    {% else %}
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9 9h6v6H9z"/></svg>
    {% endif %}
    <span>{{ category|title }}</span>
  </button>
  {% endfor %}
</div>
{{ selected_instruments|json_script:"selected-instruments-data" }}
<script src="{% static 'player/js/instrument_selector.js' %}?v=1"></script>
{% endif %}
