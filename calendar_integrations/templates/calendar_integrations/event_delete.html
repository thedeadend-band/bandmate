{% extends "player/base.html" %}
{% block title %}Delete Event – BandMate{% endblock %}
{% block content %}<a class="back-link" href="{% url 'calendar_events:detail' kind event.pk %}">Cancel</a>
<div class="wiz-content feature-content"><h1 class="page-title">Delete {{ event.title }}?</h1><p>{{ event.calendar.name }} · {{ event.starts_at }} – {{ event.ends_at }}</p>
{% if error %}<p class="error-message" role="alert">{{ error }}</p>{% endif %}
<form method="post">{% csrf_token %}<input type="hidden" name="operation_key" value="{{ operation_key }}"><input type="hidden" name="version" value="{{ version }}"><input type="hidden" name="confirm" value="yes"><button type="submit" class="btn btn-secondary">Confirm deletion</button></form></div>{% endblock %}
